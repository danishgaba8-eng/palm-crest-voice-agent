services:
  - type: web
    name: palm-crest-voice-webhook
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn voice_agent.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: RETELL_API_KEY
        sync: false
      - key: SHEETS_WEBHOOK_URL
        sync: false
      - key: SHEETS_WEBHOOK_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: AGENCY_NAME
        value: Palm Crest Realty
      - key: AGENCY_PHONE
        sync: false
